name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: paperforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check backend syntax
        run: python -m py_compile backend/main.py backend/idea_studio.py backend/state_store.py
